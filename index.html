<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexren Store</title>
  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9637911856180622"
     crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tektur:wght@400..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- GSAP CDN for smooth staggered animations -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
  <!-- Fullscreen Animated Gradient ASCII Background -->
  <div id="bg-container" class="gradient-ascii-container">
    <canvas id="bg-canvas" class="gradient-ascii-canvas" aria-hidden="true"></canvas>
  </div>

  <!-- Top Navigation Bar - Pill Bar with Masked Heading -->
  <header id="top-nav-bar" class="top-nav-container">
    <div class="top-nav-bar">
      <!-- Left: GitHub profile link button -->
      <div class="top-nav-left">
        <a id="top-nav-github-btn" href="https://github.com/NotShubh28" target="_blank" rel="noopener noreferrer" class="top-nav-icon-btn" aria-label="Open GitHub Profile" title="GitHub Profile">
          <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20" aria-hidden="true">
            <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
          </svg>
        </a>
      </div>

      <!-- Center: "Nexren" with masked heading -->
      <div class="top-nav-center">
        <h1 class="top-nav-masked-heading">Nexren</h1>
      </div>

      <!-- Right: Feedback & Report button -->
      <div class="top-nav-right">
        <button id="top-nav-report-btn" class="top-nav-icon-btn" aria-label="Report bug or request feature" title="Report bug or request feature" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="20" height="20" aria-hidden="true">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
        </button>
      </div>
      <span class="top-nav-rim" aria-hidden="true"></span>
    </div>
  </header>

  <!-- Staggered Menu Component Container -->
  <div id="staggered-menu-mount"></div>

  <!-- Apps Showcase View - Default Home Screen -->
  <main id="apps-showcase" class="apps-showcase" style="display: flex;">
    <!-- BounceCards Mount Container -->
    <div id="bounce-cards-mount" class="bounce-cards-container"></div>
    <!-- Direct Download Nexren Button Mount -->
    <div id="specular-btn-mount" class="specular-btn-container"></div>
  </main>

  <!-- App Detail Modal -->
  <div id="app-detail-modal" class="app-modal" aria-hidden="true">
    <div class="app-modal-backdrop"></div>
    <div class="app-modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-app-name">
      <span class="app-modal-grabber" aria-hidden="true"></span>
      <button id="app-modal-close" class="app-modal-close" aria-label="Close dialog" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" width="14" height="14" aria-hidden="true">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>

      <div class="app-modal-scroll">
        <header class="app-modal-hero">
          <div class="app-modal-mini-icon">
            <img id="modal-app-mini-icon" src="" alt="" />
          </div>
          <div class="app-modal-heading">
            <h2 id="modal-app-name" class="app-modal-name">App Name</h2>
            <p id="modal-app-category" class="app-modal-category"></p>
            <p id="modal-app-author" class="app-modal-author"></p>
          </div>
        </header>

        <div class="app-modal-specs">
          <div class="spec-item"><span class="spec-label">Version</span><span class="spec-val" id="modal-app-version">v1.0.0</span></div>
          <div class="spec-item"><span class="spec-label">Size</span><span class="spec-val" id="modal-app-size">34 MB</span></div>
          <div class="spec-item"><span class="spec-label">Downloads</span><span class="spec-val" id="modal-app-downloads">0</span></div>
        </div>

        <p id="modal-app-desc" class="app-modal-desc">Detailed description of the application.</p>

        <!-- Screenshots Collapsible Preview Section -->
        <div id="modal-preview-wrapper" class="app-modal-preview-wrapper" style="display: none;">
          <button id="modal-preview-toggle-btn" class="modal-preview-toggle-btn" type="button" aria-expanded="false" aria-controls="modal-preview-collapse">
            <span class="preview-btn-text">Screenshots</span>
            <svg class="preview-chevron" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </button>

          <div id="modal-preview-collapse" class="modal-preview-collapse" aria-hidden="true" inert>
            <div id="modal-carousel-mount" class="modal-carousel-mount"></div>
          </div>
        </div>
      </div>

      <footer class="app-modal-footer">
        <div class="app-modal-actions" id="modal-install-btn-mount"></div>
        <p id="modal-install-note" class="app-modal-note" aria-live="polite"></p>
      </footer>
    </div>
  </div>

  <!-- Contact Modal Overlay with SpotlightCard -->
  <div id="contact-modal" class="contact-modal" aria-hidden="true">
    <div class="contact-modal-backdrop"></div>
    <div class="contact-modal-content">
      <div id="contact-spotlight-card" class="spotlight-card sc-profile-card">
        <span class="spotlight-card__light" aria-hidden="true"></span>
        <span class="spotlight-card__grain" aria-hidden="true"></span>
        <span class="spotlight-card__border" aria-hidden="true"></span>
        <span class="spotlight-card__edge" aria-hidden="true"></span>

        <!-- Card Content Matching Image -->
        <div class="sc-header">
          <div class="sc-pfp">
            <img src="pfp.png" alt="Shobhit Pandey" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block;" />
          </div>
          <button id="contact-close-btn" class="sc-share-btn" aria-label="Close" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
              <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" x2="12" y1="2" y2="15"/>
            </svg>
          </button>
        </div>

        <div class="sc-identity-row">
          <div class="sc-identity-text">
            <h3 class="sc-name">Shobhit Pandey</h3>
            <p class="sc-role">Developer</p>
          </div>
        </div>

        <button id="contact-support-btn" class="sc-touch-btn" type="button">Support</button>
      </div>
    </div>
  </div>

  <!-- Downloads Modal with AnimatedList Component -->
  <div id="downloads-modal" class="downloads-modal" aria-hidden="true">
    <div class="downloads-modal-backdrop"></div>
    <div class="downloads-modal-card">
      <div class="downloads-modal-header">
        <div class="downloads-modal-title-row">
          <div class="downloads-modal-icon-badge">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="20" height="20">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/>
            </svg>
          </div>
          <div>
            <h3 class="downloads-modal-title">Downloads</h3>
            <p class="downloads-modal-subtitle">Apps you have downloaded</p>
          </div>
        </div>
        <button id="downloads-modal-close" class="downloads-modal-close" aria-label="Close dialog">×</button>
      </div>
      <div id="downloads-list-mount" class="downloads-list-mount"></div>
    </div>
  </div>

  <!-- Feedback / Complaint / Feature Request Modal (Minimal Glassmorphic) -->
  <div id="report-modal" class="report-modal" aria-hidden="true">
    <div class="report-modal-backdrop" id="report-modal-backdrop"></div>
    <div class="report-modal-card" role="dialog" aria-modal="true" aria-labelledby="report-modal-title">
      <!-- Minimal Header -->
      <div class="report-modal-header">
        <div class="report-modal-title-row">
          <span class="report-modal-dot" aria-hidden="true"></span>
          <h3 id="report-modal-title" class="report-modal-title">Feedback & Reports</h3>
        </div>
        <button id="report-modal-close" class="report-modal-close" aria-label="Close dialog" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <form id="report-form" class="report-modal-form">
        <!-- Minimal Category Segmented Switcher -->
        <div class="report-type-toggle">
          <label class="report-type-option">
            <input type="radio" name="reportType" value="Bug / Issue" checked />
            <span class="report-type-pill">Bug Report</span>
          </label>
          <label class="report-type-option">
            <input type="radio" name="reportType" value="Feature Request" />
            <span class="report-type-pill">Feature Request</span>
          </label>
        </div>

        <!-- Minimal Inputs -->
        <div class="report-form-group">
          <input
            type="text"
            id="report-subject"
            class="report-form-input"
            placeholder="Subject..."
            required
            maxlength="120"
          />
        </div>

        <div class="report-form-group">
          <textarea
            id="report-description"
            class="report-form-textarea"
            rows="3"
            placeholder="Describe the bug or feature request..."
            required
            maxlength="1500"
          ></textarea>
        </div>

        <div class="report-form-group">
          <input
            type="text"
            id="report-contact"
            class="report-form-input"
            placeholder="Your contact (optional: email, discord)..."
            maxlength="100"
          />
        </div>

        <!-- SpecularButton Mount Container -->
        <div id="report-specular-mount" class="report-specular-mount"></div>

        <div id="report-form-status" class="report-form-status" aria-live="polite"></div>
      </form>
    </div>
  </div>

  <!-- App Dock Container -->
  <div id="dock-container" class="dock-wrapper"></div>

  <script src="flying-button.js"></script>
  <script src="specular-button.js"></script>
  <script src="depth-carousel.js"></script>
  <script src="script.js"></script>
</body>
</html>
